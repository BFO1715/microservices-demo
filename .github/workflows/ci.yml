
name: Microservices CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check backend services
        run: |
          for dir in user-service video-service api-gateway; do
            (cd "$dir" && npm ci)
          done
          node --check user-service/index.js
          node --check video-service/index.js
          node --check api-gateway/app.js

      - name: Build React frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build Docker images
        run: docker compose build
